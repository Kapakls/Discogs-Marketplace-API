{% extends "library/base.html" %}

{% block title %}
    PhysicalMatch - Loading
{% endblock %}

{% block content %}

<section class="music-loading">

    <div class="loading-content">

        <p class="section-label">PHYSICALMATCH</p>

        <h1>
            Finding your <span>physical releases.</span>
        </h1>

        <p>
            We're checking your Spotify collection against the
            Discogs marketplace.
        </p>

        <div class="loading-spinner"></div>

        <span class="loading-status">
            Fetching marketplace data...
        </span>

    </div>

</section>

<script>
    fetch("{% url 'music_fetch' %}")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to fetch music");
            }

            window.location.href = "{% url 'music_results' %}";
        })
        .catch(error => {
            console.error(error);

            document.querySelector(".loading-status").textContent =
                "Something went wrong while fetching your music.";
        });
</script>

{% endblock %}
